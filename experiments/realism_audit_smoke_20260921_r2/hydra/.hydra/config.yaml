        - ${..weight_variables.route}
        - ${..weight_variables.scenario_ttc}
        - ${..weight_variables.llm_anchor}
        configs: {}
      loss_configs:
        scenario_collision:
          safety_margin: 0.5
          temperature: 0.5
          loss_timesteps: ${sim.traffic_model.prediction_horizon}
          filter_timesteps: ${sim.traffic_model.prediction_horizon}
          loss_scale: 1.0
          attack_protection_frames: 2
          attack_relaxation_frames: 6
          attack_contact_ramp_frames: 2
          controlled_contact_penetration: 0.05
          max_contact_penetration: 0.15
          contact_loss_scale: 1.0
          penetration_loss_scale: 5.0
          safety_penetration_loss_scale: 100.0
