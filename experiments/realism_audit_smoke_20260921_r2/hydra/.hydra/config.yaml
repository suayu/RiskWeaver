    limit_train_batches: 1.0
    limit_val_batches: 1.0
    num_samples_to_visualize: null
    viz_dir: null
    max_steps: 1000000
    warmup_steps: 500
    lr_schedule: null
    lr: 0.0005
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-07
    weight_decay: 0.0001
    gradient_clip_val: 10.0
    loss_type: l2
    lane_weight: 10
    lane_conn_weight: 0.1
  model:
    hidden_dim: 256
    map_attr: 3
    num_road_types: 1
    num_heads: 8
    num_reward_components: 1
    dim_feedforward: 1024
    dropout: 0
