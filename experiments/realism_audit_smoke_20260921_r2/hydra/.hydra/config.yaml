          max_speed: 20.0
          max_acceleration: 6.0
          max_jerk: 20.0
          max_step_distance: 2.0
          kinematics_loss_scale: 1.0
        route:
          lane_margin: 1.0
          nonlinear_factor: 5.0
          loss_timesteps: 32
          filter_timesteps: 32
          loss_scale: 1.0
        scenario_ttc:
          distance_bandwidth: 2.0
          time_bandwidth: 2.0
          min_velocity_diff: 0.1
          max_ttc: 6.0
          attraction_max_clearance: 20.0
          loss_timesteps: 20
          filter_timesteps: 20
          loss_scale: 1.0
