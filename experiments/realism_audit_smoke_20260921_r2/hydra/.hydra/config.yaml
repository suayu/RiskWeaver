dataset_name:
  name: waymo
ae:
  dataset:
    dataset_path: ${dataset_root}/scenario_dreamer_waymo
    max_num_agents: 30
    max_num_lanes: 100
    upsample_lane_num_points: 1000
    remove_offroad_agents: true
    offroad_threshold: 1.5
    fov: 64
    num_points_per_lane: 20
    num_agent_types: 3
    num_lane_types: 0
    num_lane_connection_types: 6
    num_map_ids: 2
    min_speed: 0
    max_speed: 114.088
    min_length: -0.098
    max_length: 22.929
    min_width: 0.096
    max_width: 12.527
    min_lane_x: -32
    max_lane_x: 32
    min_lane_y: -32
    max_lane_y: 32
    preprocess: true
    preprocess_dir: ${dataset_root}/scenario_dreamer_ae_preprocess_waymo
    generate_only_vehicles: false
    remove_left_right_connections: false
  train:
    seed: 0
    save_dir: ${scratch_root}/checkpoints/
    run_name: scenario_dreamer_autoencoder_waymo
    wandb_project: scenario-dreamer
    wandb_entity: null
    track: false
    accelerator: auto
    devices: 1
    precision: 32-true
    check_val_every_n_epoch: 1
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    num_samples_to_visualize: 10
    viz_dir: ${project_root}/viz_val_${ae.train.run_name}
    max_steps: 350000
    warmup_steps: 1000
    lr_schedule: linear
    lr: 0.0001
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-07
    weight_decay: 0.0001
    gradient_clip_val: 10.0
    loss_type: l2
    lane_weight: 10
    lane_conn_weight: 0.1
  eval:
    seed: 0
    save_dir: ${scratch_root}/checkpoints/
    run_name: scenario_dreamer_autoencoder_waymo
    num_samples_to_visualize: 50
    visualize_lane_graph: false
    viz_dir: ${project_root}/viz_eval_${ae.eval.run_name}
    cache_latents:
      enable_caching: false
      split_name: train
      latent_dir: ${scratch_root}/scenario_dreamer_autoencoder_latents_waymo
      nocturne_train_filenames_path: ${project_root}/metadata/nocturne_train_filenames.pkl
      nocturne_val_filenames_path: ${project_root}/metadata/nocturne_val_filenames.pkl
  model:
    hidden_dim: 512
    num_encoder_blocks: 2
    num_decoder_blocks: 2
    lane_attr: 2
    num_heads: 4
    dropout: 0
    dim_f: 2048
    state_dim: 7
    num_agent_types: 3
    lane_conn_attr: ${ae.dataset.num_lane_connection_types}
    num_lane_types: ${ae.dataset.num_lane_types}
    agent_hidden_dim: 256
    agent_num_heads: 4
    agent_dim_f: 1024
    lane_conn_hidden_dim: 64
    lane_latent_dim: 24
    agent_latent_dim: 8
    kl_weight: 0.01
    lane_weight: 10
    lane_conn_weight: 10
    cond_dis_weight: 0.1
    num_points_per_lane: ${ae.dataset.num_points_per_lane}
    max_num_lanes: ${ae.dataset.max_num_lanes}
  datamodule:
    train_batch_size: 128
    val_batch_size: 128
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    _target_: datamodules.waymo.waymo_datamodule_autoencoder.WaymoDataModuleAutoEncoder
    dataset_cfg: null
ldm:
  dataset:
    dataset_path: ${dataset_root}/scenario_dreamer_autoencoder_latents_waymo
    max_num_agents: 30
    max_num_lanes: 100
    upsample_lane_num_points: 1000
    remove_offroad_agents: true
    offroad_threshold: 1.5
    fov: 64
    num_points_per_lane: 20
    num_agent_types: 3
    num_lane_types: 0
    num_lane_connection_types: 6
    num_map_ids: 2
    min_speed: 0
    max_speed: 114.088
    min_length: -0.098
    max_length: 22.929
    min_width: 0.096
    max_width: 12.527
    min_lane_x: -32
    max_lane_x: 32
    min_lane_y: -32
    max_lane_y: 32
    latent_stats_dir: ${project_root}/metadata/latent_stats
    latent_stats_path: ${ldm.dataset.latent_stats_dir}/${ldm.model.autoencoder_run_name}.pkl
    agent_latents_mean: null
    agent_latents_std: null
    lane_latents_mean: null
    lane_latents_std: null
  train:
    seed: 0
    save_dir: ${scratch_root}/checkpoints/
    run_name: scenario_dreamer_ldm_base_waymo
    wandb_project: scenario-dreamer
    wandb_entity: null
    track: false
    accelerator: auto
    devices: 4
    precision: 32-true
    check_val_every_n_epoch: 2
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    num_samples_to_visualize: 10
    viz_dir: ${project_root}/viz_val_${ldm.train.run_name}
    max_steps: 165000
    warmup_steps: 500
    lr_schedule: constant
    lr: 0.0001
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-07
    weight_decay: 1.0e-05
    gradient_clip_val: 10.0
    loss_type: l2
    lane_weight: 10
    lane_conn_weight: 0.1
    save_top_k: 0
    ema_decay: 0.9999
    guidance_scale: 4.0
    num_batches_compute_stats: 250
    batch_size_compute_stats: 1024
  eval:
    seed: 0
    save_dir: ${scratch_root}/checkpoints/
    run_name: scenario_dreamer_ldm_base_waymo
    mode: initial_scene
    num_samples: 100
    init_prob_matrix_path: ${project_root}/metadata/initial_prob_matrix_waymo.pt
    inpainting_prob_matrix_path: ${project_root}/metadata/inpainting_prob_matrix_waymo.pt
    batch_size: 32
    visualize: false
    viz_dir: ${project_root}/viz_gen_samples_${ldm.eval.run_name}
    cache_samples: false
    conditioning_path: null
    sim_envs:
      num_inpainting_candidates: 8
      overhead_factor: 5
      route_length: 500
      nocturne_compatible_only: true
    metrics:
      samples_path: ${dataset_root}/checkpoints/${ldm.eval.run_name}/initial_scene_samples
      metrics_save_path: ${dataset_root}/checkpoints/${ldm.eval.run_name}
      eval_set: ${project_root}/metadata/waymo_eval_set.pkl
      gt_test_dir: ${dataset_root}/scenario_dreamer_ae_preprocess_waymo/test
  model:
    autoencoder_run_name: scenario_dreamer_autoencoder_waymo
    autoencoder_path: ${scratch_root}/checkpoints/${ldm.model.autoencoder_run_name}/last.ckpt
    hidden_dim: 2048
    num_heads: 16
    agent_hidden_dim: 512
    agent_num_heads: 8
    num_factorized_dit_blocks: 2
    lane_latent_dim: 24
    agent_latent_dim: 8
    dropout: 0
    label_dropout: 0.1
    num_l2l_blocks: 1
    n_diffusion_timesteps: 100
    lane_sampling_temperature: 0.75
    diffusion_clip: 5
  datamodule:
    train_batch_size: 256
    val_batch_size: 256
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    _target_: datamodules.waymo.waymo_datamodule_ldm.WaymoDataModuleLDM
    dataset_cfg: null
ctrl_sim:
  dataset:
    preprocess: true
    preprocess_dir: ${dataset_root}/scenario_dreamer_ctrl_sim_preprocess
    dataset_path: ${dataset_root}/scenario_dreamer_waymo
